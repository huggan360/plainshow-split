# PlainShow Split: https://split.plainshow.se
<VirtualHost *:80>
    ServerName split.plainshow.se
    Alias /.well-known/acme-challenge/ "/var/lib/plainshow/publishing/domains/split.plainshow.se/webroot/.well-known/acme-challenge/"
    <Directory "/var/lib/plainshow/publishing/domains/split.plainshow.se/webroot/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName split.plainshow.se
    DocumentRoot "/srv/plainshow/split/current/public"
    <Directory "/srv/plainshow/split/current/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # PHP runs in the plainshow-split FPM pool, as its own user.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/plainshow-split.sock|fcgi://plainshow-split"
    </FilesMatch>
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>
    Header always set Strict-Transport-Security "max-age=31536000"
    # Real visitor addresses behind Cloudflare.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxyList /etc/apache2/cloudflare-ips.txt
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/split.plainshow.se/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/split.plainshow.se/privkey.pem
    ErrorLog ${APACHE_LOG_DIR}/split.plainshow.se-error.log
    CustomLog ${APACHE_LOG_DIR}/split.plainshow.se-access.log combined
</VirtualHost>
</IfModule>
